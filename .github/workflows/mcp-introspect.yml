name: mcp-introspect

# Verifies the public daemon binary still starts as a stdio MCP server and
# advertises its tools (initialize + tools/list). Runs on push and weekly, so a
# broken download or a server that stops introspecting surfaces as a red check.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download public daemon binary
        run: |
          curl -fsSL https://app.proofpane.com/daemon/airgov_daemon-linux-x86_64 -o airgov_daemon
          chmod +x airgov_daemon
      - name: Introspect (initialize + tools/list)
        run: python3 scripts/mcp_introspect_check.py
